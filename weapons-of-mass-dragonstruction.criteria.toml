# Arena lets you choose; the shock is always paid early and Cliffs is untapped through turn 3.
[assume]
untapped = ['name:"Blood Crypt"', 'name:"Blackcleave Cliffs"']

[mulligan]
keep = [{ query = "t:land", min = 2, max = 5 }]
down_to = 6
bottom = ['mv>=5', 't:land']

[[criterion]]
name = "an engine (Manufacturing or Anvil) in hand by turn 3"
at_least = 0.70
require = [{ turn = 3, query = 'name:"Weapons Manufacturing" or name:"Oni-Cult Anvil"', min = 1 }]

[[criterion]]
name = "Manufacturing plus a cheap artifact to follow it by turn 3"
at_least = 0.35
require = [
  { turn = 3, query = 'name:"Weapons Manufacturing"', min = 1 },
  { turn = 3, query = 'cat:"Cheap Artifact"', min = 1 },
]

[[criterion]]
name = "Rakdos on turn 2"
at_least = 0.88
require = [{ turn = 2, can_cast = "{B}{R}" }]

[[criterion]]
name = "Mayhem Devil castable on turn 3"
at_least = 0.75
require = [{ turn = 3, can_cast = "{1}{B}{R}" }]

[[criterion]]
name = "a draw spell by turn 4"
at_least = 0.70
require = [{ turn = 4, query = 'cat:"Card Draw"', min = 1 }]

[[criterion]]
name = "cheap removal by turn 2"
at_least = 0.85
require = [{ turn = 2, query = 'cat:"Removal" mv<=2', min = 1 }]

[[expect]]
name = "lands in opener"
turn = 0
query = "t:land"
