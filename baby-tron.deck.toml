name = "Baby Tron"
format = "commander"
description = """
A card pool, not a deck: every candidate for Maldhound's Baby Tron ramp package (Good Time Boys ep 63 and 65). Baby Tron is a 1-3-5 mana ladder in green. A 1-mana accelerant on turn 1, a 3-mana ramp piece on turn 2 off two lands plus the elf, then 5+ mana on turn 3. Maldhound only allows Cultivate if the deck shows about 11 ways to make an extra mana on turn 1.

Elf: mana value 1, gives you a third mana on turn 2 with no other setup. The "Needs Lands In Hand" ones do it by putting extra lands down, so they need spare lands in hand.

Cultivate: mana value 3, adds at least one permanent mana by turn 3 and does something else too (a land to hand, a card, a body, removal, haste, a flashback). A 3-drop that taps for two or more counts on its own. Sub-tags say how it ramps: Land Ramp, Dork, Land Aura, Rock, Planeswalker.

Filtered to green or colourless identity. No Game Changers, no Sol Ring.
"""

