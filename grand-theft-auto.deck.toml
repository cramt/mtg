name = "Grand Theft Auto"
format = "commander"
description = """
The fifth Lantern deck, and the one that drives. Lantern of Insight and Wizened Snitches make every player play with their top card revealed, so the whole table can see what each library is about to give up.

Edward Kenway steals with Vehicles. Whenever a Vehicle you control deals combat damage to a player, you look at their top card, exile it face down and can play it for as long as it stays exiled. The trigger can't choose, so Lantern chooses for you: you already know which opponent has the Cyclonic Rift on top, and you declare attackers accordingly. That makes the attack step a negotiation. "The Copter's coming for whoever has the Rift, unless someone would like to make me an offer."

Edward doesn't let you spend mana of any type on stolen cards, so he pays for them himself: at your end step he makes a Treasure for each tapped Assassin, Pirate and Vehicle. Vehicles tap to attack and crew tap to crew, so every steal funds its own off-colour mana. Changeling Outcast and Universal Automaton count as both Assassin and Pirate.

The sculpting pieces decide what's worth taking. Wand of Denial bins a nonland top card for 2 life, Codex Shredder mills one player and Ghoulcaller's Bell mills everyone. Unwinding Clock untaps them, and every Vehicle, on each other player's turn, so you sculpt again and still have blockers. Tezzeret, Cruel Captain's 0 untaps a sculptor for a second go. His loyalty grows from every Treasure, and Heart of Kiran can be crewed by spending that loyalty.

Top Setup goes the other way. Memory Lapse and Hinder counter a spell onto the top of its owner's library for a Vehicle to take back, Misinformation stacks three cards from an opponent's graveyard (what you just milled, say) onto their library, and Scheming Symmetry lets two opponents tutor to the top. One of them gets robbed.

Trinket Mage, Fabricate, Tezzeret, Diabolic Tutor, Grim Tutor, Urza's Saga and Inventors' Fair find Lantern. Adéwalé finds a Vehicle and comes back whenever one connects.

Desynchronization bounces every nonland permanent that isn't historic. Vehicles, Lantern, rocks and legendary crew are all artifacts or legendary, so it's nearly one-sided. Blasphemous Act and Toxic Deluge kill creatures but leave uncrewed Vehicles standing.

Closing: Reckless Fireweaver pings every opponent for each Treasure, Port Razer untaps everything for an extra combat, so every Vehicle steals twice, and Phoenix Fleet Airship copies itself every turn you sacrifice a Treasure."""

