# Meldweb Curator's settings.

[printings]
# Which printing of a card to offer first. Each rule is a Scryfall query
# over one printing. The first rule that tells two printings apart
# decides, and later ones only break ties; untold apart, newest first.
# A rule shaped `!"Sol Ring" set:c21 cn:263` pins one card's printing.
rank = [
  { avoid = "is:digital" },
  { avoid = "border:gold or border:silver or is:oversized or is:playtest or st:memorabilia" },
  { avoid = "-lang:en" },
  { prefer = "t:basic is:fullart" },
  { avoid = "is:textless" },
  { avoid = "set:mp2" },
  { avoid = "set:slz" },
  { avoid = "is:flavorname" },
  { avoid = "is:sourcematerial" },
  { avoid = "is:showcase or frame:old or frame:future or frame:etched or is:poster" },
  { avoid = "is:ub" },
]

[decks]
# The deck list's order, by file. A deck not here goes after these,
# by name.
order = [
  "munchausen-syndrome",
  "kellan-s-casino-2",
  "ashnod-will-punch-you",
  "attack-of-the-cids",
  "caradora-and-her-golden-argussy",
  "go-go-gadget-eldrazi",
  "go-go-gadget-eldrazi-bargain-bin",
  "i-m-the-titanic-you-re-an-iceberg",
  "pirates-on-a-bicycle",
  "road-trip-through-the-blind-eternities",
  "senu-later",
  "sigarda-joins-the-templars",
  "spoiler-alert",
  "there-s-no-place-like-loam",
  "an-apple-a-day",
  "pest-control",
  "solve-for-x",
]

[friends]
# GitHub logins whose public Magic repo a deck's sourcing reads, to
# say who has the cards the collection is short of.
logins = ["GrothenKek"]
