# Meldweb Curator's settings.

[printings]
# Which printing of a card to offer first. Each rule is a Scryfall query
# over one printing. The first rule that tells two printings apart
# decides, and later ones only break ties; untold apart, newest first.
# A rule shaped `!"Sol Ring" set:c21 cn:263` pins one card's printing.
rank = [
  { avoid = "is:digital" },
  { avoid = "border:gold or border:silver or is:oversized or is:playtest or st:memorabilia" },
  { avoid = "-lang:en" },
  { prefer = "t:basic is:fullart" },
  { avoid = "is:textless" },
  { avoid = "set:mp2" },
  { avoid = "set:slz" },
  { avoid = "is:flavorname" },
  { avoid = "is:sourcematerial" },
  { avoid = "is:showcase or frame:old or frame:future or frame:etched or is:poster" },
  { avoid = "is:ub" },
]

[decks]
# The deck list's order, by file. A deck not here goes after these,
# by name.
order = [
  "decks/munchausen-syndrome.deck.toml",
  "decks/ashnod-will-punch-you.deck.toml",
  "decks/attack-of-the-cids.deck.toml",
  "decks/caradora-and-her-golden-argussy.deck.toml",
  "decks/go-go-gadget-eldrazi.deck.toml",
  "decks/go-go-gadget-eldrazi-bargain-bin.deck.toml",
  "decks/i-m-the-titanic-you-re-an-iceberg.deck.toml",
  "decks/kellan-s-casino-2.deck.toml",
  "decks/pirates-on-a-bicycle.deck.toml",
  "decks/road-trip-through-the-blind-eternities.deck.toml",
  "decks/senu-later.deck.toml",
  "decks/sigarda-joins-the-templars.deck.toml",
  "decks/spoiler-alert.deck.toml",
  "decks/there-s-no-place-like-loam.deck.toml",
]
