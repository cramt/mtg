name = "Tellah Splice Is Twice As Nice"
format = "commander"
description = """
Imported from Moxfield (https://moxfield.com/decks/TK-I1Xcx9U2KKnbQMg4ROA, by KeepingItCasual), recategorized by what each card's oracle text does. The 63-card Moxfield maybeboard is kept as Maybeboard.

Tellah, Great Sage rewards mana spent, not mana value: four or more spent on a noncreature spell draws two, eight or more sacrifices Tellah and deals that much to each opponent. Splice onto Arcane is how a one-mana Arcane spell gets there, because splice costs count as mana spent on the spell. Every noncreature spell also makes a Hero token.

The tokens are the second engine. Zada, Leyline of Resonance, Mirrorwing Dragon, Frontline Heroism, Radiate and Radiant Performer copy a spell that targets one of your creatures onto the rest, so Veil of Secrecy makes the whole team unblockable, Overblaze doubles every creature's damage and Unnatural Speed gives the team haste. Radiate on Blind with Anger steals every nonlegendary creature that can be targeted.

Psychic Puppetry and Toils of Night and Day untap Gilded Lotus or Lotus Field for three more mana. Peer Through Depths, Reach Through Mists and Sift Through Sands in one turn put The Unspeakable onto the battlefield, and it returns Arcane cards when it connects.

Tension: the cost reducers (Mizzix, Vadrik, Archmage of Runes, Case of the Ransacked Lab, Wizards of Thay, Mindsplice Apparatus, Font of Magic) cut mana spent, which works against Tellah's four- and eight-mana thresholds.

House ban: the list runs Sol Ring, so `scryfall check` fails until it's swapped out."""

