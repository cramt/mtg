name = "Baby Tron Elves"
format = "commander"
description = """
The turn-1 half of Maldhound's Baby Tron package (Good Time Boys ep 63 and 65), the 1-3-5 mana ladder: a 1-mana accelerant on turn 1, a 3-mana ramp piece on turn 2, then 5+ mana on turn 3. He wants about 11 of these before a deck gets to run Cultivate. The other half is Baby Tron Cultivates.

Each card costs 1 and gives you a third mana on turn 2 with no other setup. The "Lands From Hand" ones do it by putting extra lands down, so they need spare lands in hand.

A card pool, not a deck: green or colourless, no Game Changers, no Sol Ring.
"""

