name = "An Apple a Day"
format = "commander"
description = """
The Silverquill Influence precon with Eriette in the command zone instead of Killian, plus a few cards from the binder.

Eriette makes any creature wearing one of your Auras unable to attack you, and drains each opponent for the number of Auras you control at your end step. Auras go on both sides of the table. Opponents' creatures get the goad Auras (Coercive, Martial, Ghoulish and Parasitic Impetus, Redemption Arc, Scriv's Contracts), so they're shut off from you and pushed into everyone else. Your own creatures get the voltron and protection Auras (Angelic Destiny, Eldrazi Conscription, Eidolon of Countless Battles, Shielded by Faith) and carry them in.

Sram, Kor Spiritdancer, Sage's Reverie, Hateful Eidolon and Pearl-Ear turn Auras into cards, and Transcendent Envoy, Starfield Mystic, Pearl-Ear and Killian make them cheap. Combat Calligrapher, Breena and Firemane Commando reward the other players for fighting each other, which is what all the goad pushes them into anyway. Sun Titan, Helping Hand and Whip of Erebos bring back the cheap creatures and Auras that die along the way."""

