name = "An Apple a Day"
format = "commander"
description = """
Work in progress: this is the cards sitting in the box so far, not a finished 100.

Eriette makes any creature wearing one of your Auras unable to attack you, and drains each opponent for the number of Auras you control at your end step. Auras go on both sides of the table. Your own creatures get the voltron Auras (Angelic Destiny, Eldrazi Conscription, Eidolon of Countless Battles) and carry them in. Opponents' creatures get the cheap ones (Coercive and Martial Impetus, Mogis's Favor, Screams from Within, Darksteel Mutation), so they're both shut off from you and goaded into everyone else.

Sram, Kor Spiritdancer, Sage's Reverie and Hateful Eidolon turn Auras into cards, and Transcendent Envoy, Starfield Mystic and Killian make them cheap. Combat Calligrapher and Firemane Commando reward the other players for fighting each other, which is what Eriette's tax pushes them into anyway."""

