# Rocco's X can't be cast by this engine ({X} is refused), and can_cast under a
# [casting] line reads the mana the line left after its own ramp casts, which
# made "Rocco X=4 by turn 6" read ~17% for any ramp package. So this file asks
# about cards in hand only, with no [casting], and leaves Rocco's mana to playtests.

[mulligan]
keep = [{ query = "t:land", min = 3, max = 5 }]
down_to = 6
bottom = ['mv>=6', 't:land']

[[criterion]]
name = "turn-1 ramp in the opener"
at_least = 0.35
require = [{ turn = 0, query = 'cat:"Ramp" mv<=1', min = 1 }]

[[criterion]]
name = "any ramp piece by turn 2"
at_least = 0.70
require = [{ turn = 2, query = 'cat:"Ramp"', min = 1 }]

[[criterion]]
name = "Maskwood or a tutor for it by turn 6"
at_least = 0.40
require = [{ turn = 6, query = '''name:"Maskwood Nexus" or cat:"Maskwood Tutor" or name:"Enlightened Tutor"''', min = 1 }]

[[expect]]
name = "lands in opener"
turn = 0
query = "t:land"
