name = "Exile on Main Street"
format = "commander"
description = """
Varolz gives every creature card in the graveyard scavenge and is a free sac outlet, so one creature can be sacrificed, then exiled from the graveyard as a scavenge cost, then brought back. Normally that's a card used up. Here the squees make it a lap: Mister Immortal ({2}{G} from graveyard or exile), Eternal Scourge and Khan, Vengeful Heart (cast from exile).

Self-mill is how the squees show up, since a milled squee is still live: Grave-Troll, Stinkweed Imp, Hermit Druid, Buried Alive. Every lap trips the leaves-your-graveyard payoffs (Tormod, Teval's Judgment, Insidious Roots, Syr Konrad, Fang, Amzu), and Food Chain / City of Shadows / Altar of Bhaal exile straight off the battlefield.

Half the deck ends up in the yard, so the graveyard is a second hand: flashback, escape and aftermath (Increasing Savagery for ten counters, Visions of Dominance at {5}{G}{G} thanks to Varolz's mana value, Polukranos, Never // Return, Chainer's Edict). Every graveyard cast is a card leaving the graveyard, and escape costs can exile the squees you're about to recast.

Scavenge pays a card's mana cost but counts its power, so the ammo is cards that cannot live on the battlefield: Death's Shadow ({B}, 13), Phyrexian Dreadnought ({1}, 12), Force of Savagery (8/0) all die the moment they are cast, which is just another way into the yard. Egon is 6 power for {2}{B} and exiles two cards from the yard every upkeep. Terrasymbiosis turns each scavenge into that many cards.

The win is voltron: scavenge counters go on Varolz (Hardened Scales, Branching Evolution). Brawn gives trample while it sits in the yard, Champion of Dusan exiles itself for a permanent trample counter, and Rancor, Sword of Vengeance and Rogue's Passage cover the rest. No protection swords and no shroud: protection from black or green stops your own scavenge from targeting him (CR 702.16b), and shroud stops all targeting."""

