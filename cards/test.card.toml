name = "Kaladin, Herald of Second Chances"
type = "Legendary Planeswalker — Kaladin"
color_indicator = "WU"
loyalty = "5"
rules = """
During your turn, as long as Kaito has one or more loyalty counters on him, he’s a 3/4 Ninja creature and has hexproof.

At the beginning of your upkeep, if an opponent controls more lands than you, you may search your library for up to three basic land cards, reveal them, put them into your hand, then shuffle.

+1: Create a 1/1 white Soldier creature token.

0: Put a +1/+1 counter on each creature you control. Those creatures gain flying until your next turn.

−3: Destroy target creature an opponent controls with mana value 3 or greater."""
