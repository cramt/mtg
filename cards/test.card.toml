name = "Kaladin, Herald of Second Chances"
type = "Legendary Planeswalker — Kaladin"
color_indicator = "WU"
loyalty = "3"
rules = """
At the beginning of your upkeep, if an opponent controls more creatures than you, Kaladin becomes a 6/6 Knight Avatar with flying and indestructible until end of turn.

+1: Create a 2/2 white Knight creature token with flying and vigilance.

-1: You get an emblem with “nonlegendary Knights you control get +1/+1 and legendary knights you control get +1/+1.” and creatures you control gain flying and trample until end of turn."""
