[assume]
# Shocks assume you pay 2. Dalkovan Encampment is untapped next to any Mountain, which
# this deck almost always has by turn 2; on turn 1 that's optimistic.
untapped = ['name:"Sacred Foundry" or name:"Dalkovan Encampment"']

[mulligan]
keep = [{ query = "t:land", min = 2, max = 4 }]
down_to = 6
bottom = ['mv>=5', 't:land']

[casting]
prefer = ['name:"The Naked Time"', 'name:"Iroh, Tea Master"', 'name:"Lightning, Army of One"', 'name:"Molten Man, Inferno Incarnate"', 'name:"Voice of Victory"', 'name:"Kinscaer Sentry"', 'name:"Stiltzkin, Moogle Merchant"', 'name:"Stadium Headliner"']

# Both gifts fetch a basic Mountain tapped, which pays from the next turn.
[land_drop]
prefer = ['name:"Sacred Foundry"', 'name:"Dalkovan Encampment"', 'name:Plains', 'name:Mountain']

[[effect]]
match = 'name:"The Naked Time" or name:"Molten Man, Inferno Incarnate"'
on = "cast"
fetch = ['name:Mountain']
to = "battlefield"

[[criterion]]
name = "the dream: Naked Time turn 2, Iroh turn 3 (6 hasty, they lose a land)"
at_least = 0.10
require = [
  { turn = 2, cast = 'name:"The Naked Time"', min = 1 },
  { turn = 3, cast = 'name:"Iroh, Tea Master"', min = 1 },
]

[[criterion]]
name = "Iroh plus a land-eating gift on the battlefield by turn 4"
at_least = 0.25
require = [
  { turn = 4, cast = 'name:"Iroh, Tea Master"', min = 1 },
  { turn = 4, cast = 'cat:"Give Away Target"', min = 1 },
]

# The engine lines above land in a minority of games; the rest are won or lost on
# whether there's pressure on the board before the opponent's card advantage matters.
[[criterion]]
name = "a creature in play by turn 2"
at_least = 0.70
require = [{ turn = 2, cast = 't:creature mv<=2', min = 1 }]

[[criterion]]
name = "two creatures in play by turn 3"
at_least = 0.50
require = [{ turn = 3, cast = 't:creature', min = 2 }]
