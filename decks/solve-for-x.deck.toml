name = "Solve for X"
format = "commander"
description = """
The Quandrix Unlimited precon as it came out of the box. Not at 100 yet.

Zimone gets two +1/+1 counters the first time each turn you cast a spell with {X} in its cost, and makes that spell cheaper for each counter she has. So every turn's X spell is bigger than the last: X creatures (Hydroid Krasis, Primordial Hydra, Lifeblood Hydra, Stonecoil Serpent), X draw (Stroke of Genius, Pull from Tomorrow, Commander's Insight) and X removal (Curse of the Swine, Entrancing Melody, Primal Might).

The counters stack up through Hardened Scales, Ozolith, Benevolent Hydra and Kami of Whispered Hopes, and Unbound Flourishing doubles X outright. Owlin Spiralmancer copies the first X spell each turn, and Nev, Lattice Library and Fractal Harness turn it into more bodies. Tanazir Quandrix, Biomass Mutation and Rogue's Passage close the game once the board is big."""

