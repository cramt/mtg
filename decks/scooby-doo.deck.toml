name = "Scooby Doo"
format = "commander"
description = """
The no-thoughts deck. Play a Dog, attack with the Dogs, solve the mystery.

Sophia brings Tiny along. Every Dog that connects makes a Food and a Clue, and every Food, Clue or Treasure can become a +1/+1 counter on every Dog for {1}. Pack Leader, Generous Pup, Yoshimaru and Hardened Scales make the counters pile up. Thorough Investigation, Erdwal Illuminator, Academy Manufactor and Peregrin Took keep the Clues coming, and you crack them when you run out of Dogs to play.

Bracket 2: no Game Changers, no combos, no wipes. Just very good boys."""

