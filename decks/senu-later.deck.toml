name = "Senu Later"
format = "commander"
description = """
Senu leaves every turn and always comes back. Attack with Senu (it has vigilance) and another legend, then exile Senu before blocks, either with its own {T} or with City of Shadows. If the other legend isn't blocked, Senu comes back attacking and unblocked (CR 508.4d). It only comes back once per combat: after the first trigger returns it, Senu is a new object and the other triggers lose track of it.

City of Shadows is the mana engine. Each loop adds a storage counter, Metastatic Evangel proliferates it when Senu comes back, and Rings of Brighthearth copies the counter ability. Vesuva and Thespian's Stage are second Cities. Expedition Map, World Map, Urza's Cave and Weathered Wayfarer find the real one, and Ranger of Eos and Recruiter of the Guard find Wayfarer.

This is also the sticker deck. Stickers stay on a card in every public zone, exile and the command zone included (CR 123.5), so a sticker on Senu lasts the whole game and its abilities fire every turn: attack triggers when Senu is declared, leaves-the-battlefield triggers when it's exiled, combat-damage triggers when it comes back unblocked. Cool Fluffy Loxodon draws, Yawgmoth Merfolk Soul makes five Clown Robots, Plague Myr and Coward Parade destroy things, Elephant Meteor proliferates City, and Beeble Mascot untaps City after it exiles Senu. Delney doubles the triggers of creatures with power 2 or less, which Senu is. Park Bleater, Ticketomaton, Aerialephant, Robo-Piñata, Wicker Picker and Pin Collection put stickers on things; Bleater, Turbotubes and Midway Bamboozle make tickets.

The loop also feeds Search for Dagger and Tome of Legends (both trigger twice a turn: once when Senu attacks, once when it comes back), Welcoming Vampire, Lulu, Hero's Blade, Haliya and Ennis. Aang gets an experience counter every time Senu leaves without dying and turns those into tokens each upkeep. Genji Glove gives a legend an extra combat, and so a second loop: in that combat City exiles the freshly returned Senu, which doesn't need to tap. Phelia exiles a blocker every attack, and Tomik stops opponents targeting City. White catch-up ramp (Land Tax, Keeper of the Accord, Knight of the White Orchid, the Karoo lands) keeps the mana flowing, and Winds of Abandon and Path to Exile give opponents the extra lands that switch it on.

City's mana goes into Genji Glove, sticker tickets and a few colourless threats: Myr Battlesphere, Wurmcoil Engine, Steel Hellkite and Kozilek."""

