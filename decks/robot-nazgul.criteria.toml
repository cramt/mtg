# Bench: `gauntlet test decks/robot-nazgul.deck.toml decks/robot-nazgul.criteria.toml [--draw]`
# Mishra is a 4-drop, so the 2-mana rocks are the ramp that matters: rock on 2, Mishra on 3.
# The engine needs Mishra plus one of the two "your spells are artifacts" enchantments
# before Nazgûl casts double up, so the bars are Mishra on curve, an enabler by 5, and
# a Nazgûl or Pattern Matcher in hand once both are down.
#
# Measured 2026-10-20: Mishra by turn 4 reads 71% here and 73% with every land read
# untapped, so the checklands cost ~2 points and the rock count is the real limit.
# A "{U}{B}{R} by turn 3" bar was dropped: can_cast reads what's left after the
# casting line spends the turn's mana on Mishra, so it only re-measured the cast.

[mulligan]
keep = [{ query = "t:land", min = 2, max = 5 }]
down_to = 6
bottom = ['mv>=5', 't:land']

# Lands gauntlet reads as tapped that are untapped on the turns these bars ask about.
# Fastlands are untapped through turn 3. Slowlands are tapped only as the first or
# second land, and the bars here are turns 3-5. The MDFC lands enter untapped for 3
# life. Checklands, reveal lands and the snarl stay read as tapped: with 11 typed
# lands they're untapped about half the time early, so leaving them tapped is the floor.
[assume]
untapped = ['name:"Spirebluff Canal" or name:"Darkslick Shores" or name:"Blackcleave Cliffs" or name:"Sunken Hollow" or name:"Smoldering Marsh" or name:"Shipwreck Marsh" or name:"Haunted Ridge" or name:"Sink into Stupor" or name:"Fell the Profane"']

[casting]
prefer = ['name:"Mishra, Artificer Prodigy"', 'cat:"Ramp"']

[[criterion]]
name = "Mishra on turn 3"
at_least = 0.28
require = [{ turn = 3, cast = 'name:"Mishra, Artificer Prodigy"', min = 1 }]

[[criterion]]
name = "Mishra by turn 4"
at_least = 0.68
require = [{ turn = 4, cast = 'name:"Mishra, Artificer Prodigy"', min = 1 }]

[[criterion]]
name = "artifact enabler or a tutor for one by turn 5"
at_least = 0.55
require = [{ turn = 5, query = 'cat:"Artifact Enabler" or cat:"Tutor" -name:"Pattern Matcher"', min = 1 }]

[[criterion]]
name = "a Nazgûl or Pattern Matcher by turn 5"
at_least = 0.70
require = [{ turn = 5, query = 'cat:"Nazgûl" or name:"Pattern Matcher" or name:"Ringsight"', min = 1 }]

[[expect]]
name = "lands in opener"
turn = 0
query = "t:land"

# Rocks the standard library skips. A Signet turns {1} into two coloured mana, so it
# nets one. Fellwar Stone's colours depend on opponents' lands; read as one mana.
[[effect]]
match = 'name:"Dimir Signet" or name:"Rakdos Signet" or name:"Izzet Signet" or name:"Fellwar Stone"'
on = "cast"
adds = 1
