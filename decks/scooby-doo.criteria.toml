# Bench: `gauntlet test decks/scooby-doo.deck.toml decks/scooby-doo.criteria.toml [--draw]`
# Mana numbers are floors: Exotic Orchard and Reflecting Pool read as colourless, and
# Torgal / Long-Bodied Grey Dog's Treasure aren't modelled.

# Battle lands and checklands are untapped by turn 3 in a deck with 18 basics and typed duals.
[assume]
untapped = ['name:"Hinterland Harbor"', 'name:"Sunpetal Grove"', 'name:"Overgrown Farmland"', 'name:"Sodden Verdure"', 'name:"Canopy Vista"', 'name:"Prairie Stream"', 'name:"Fabled Passage"']

[mulligan]
keep = [{ query = "t:land", min = 2, max = 5 }]
down_to = 6
bottom = ['mv>=5', 't:land']

[casting]
prefer = ['name:"Sophia, Dogged Detective"', 'cat:"Ramp"']

[[effect]]
match = 'name:"Fellwar Stone"'
on = "cast"
adds = 1

[[criterion]]
name = "Sophia on curve (4-drop: turn 3)"
at_least = 0.08
require = [{ turn = 3, cast = 'name:"Sophia, Dogged Detective"', min = 1 }]

[[criterion]]
name = "Sophia by turn 4"
at_least = 0.50
require = [{ turn = 4, cast = 'name:"Sophia, Dogged Detective"', min = 1 }]

[[criterion]]
name = "a two-drop Dog by turn 2"
at_least = 0.70
require = [{ turn = 2, query = 'cat:"Dog" and mv<=2', min = 1 }]
