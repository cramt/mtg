name = "Insider Trading"
format = "commander"
description = """
The fourth Lantern deck, and the political one. Lantern of Insight makes every player play with their top card revealed, so the whole table knows what's coming. You hold the mill button, so you decide what actually arrives.

Gonti, Night Minister turns that into a market. Whenever any creature deals combat damage to one of your opponents, that creature's controller exiles the top card of that opponent's library and may play it, lands included (it uses their land drop). Damage to you triggers nothing. Opponents are paid to hit each other, and everyone can see what each attack will steal before blocks. Whoever casts a spell they don't own gets a Treasure, so the table keeps robbing itself.

The sculpting pieces (Wand of Denial, Codex Shredder, Ghoulcaller's Bell, Pyxis of Pandemonium, Scrib Nibblers, Millstone, Grindstone, Sands of Delirium) decide what's worth stealing. Bin the bomb before an opponent's attack and they steal a land; leave it for your own. Unwinding Clock untaps them on every opponent's turn, so the threat is always live, and leaving them untapped is the leverage. Urza's Saga fetches the 0- and 1-cost pieces.

Misinformation puts the best milled card back on top for someone to steal. Scheming Symmetry has two opponents each tutor a card to the top of their own library, and you take it. Cunning Rhetoric steals from anyone who attacks you, and Gix gives a card to anyone who hits your opponents, so attacking each other is always the better deal.

Your own theft doesn't need combat: Court of Locthwain, Blightwing Bandit, Brainstealer Dragon, Lobelia, Black Cat, Gonti, Lord of Luxury, Outrageous Robbery, Inside Information, Praetor's Grasp and Thieving Amalgam. Changeling Outcast, Tormented Soul, Tinybones, Nashi, Dream-Thief's Bandana and Thieves' Tools get Gonti's trigger yourself. Dauthi Voidwalker turns every milled card into one you can play.

Closing: Brainstealer Dragon drains for every stolen permanent, Thieving Amalgam drains when stolen creatures die, Exsanguinate is the Treasure-fuelled X spell, and Heartless Conscription steals every creature on the board."""

