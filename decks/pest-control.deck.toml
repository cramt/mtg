name = "Pest Control"
format = "commander"
description = """
The Witherbloom Pestilence precon, with a few swaps from the binder. Not at 100 yet.

Dina draws a card the first time each turn you sacrifice a creature, and her own ability turns a sacrificed creature into life and +1/+1 counters on whatever you keep. So the deck is a pile of bodies that come back or leave something behind: Pest makers (Pest Rescuer, Blight Mound, Ribtruss Roaster, Beledros), recursive creatures (Bloodghast, Nether Traitor, Teacher's Pest), and free sac outlets (Viscera Seer, Umbral Collar Zealot, Woe Strider, Yahenni).

Every Pest gains a life when it dies, and that life is the second engine. Blood Artist and Zulaport Cutthroat drain on every death, Pest Rescuer adds one to every lifegain, Trudge Garden turns it into 4/4s, and Witch of the Moors makes each opponent sacrifice a creature at your end step. Morbid Opportunist and Moldervine Reclamation keep the cards coming alongside Dina."""

