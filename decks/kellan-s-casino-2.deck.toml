name = "Kellan's Casino"
format = "commander"
description = """
Welcome to Kellan's Casino, where the house always wins. In the casino, players can win by opening loot boxes (battles), which can contain many things.

The actual rule: when a player defeats a battle, I cast it for free and get a Kellan trigger, and my opponents choose the permanent I cast and its targets (anything except my stuff). That holds for everything the free cast sets off too: if they pick Shardless Agent, they also aim whatever it cascades into. Spiritually, defeating a battle lets them mindslave me until the stack is empty. This is where Kellan's Casino becomes a midrange-y board control/politics/slug deck. The ideal game plan:
- I play Invasion of Ravnica (that's value for me)
- an opponent defeats the battle because they want value
- the battle is defeated, I get the back side (value for me), and they pick a card for me to cast
- they pick Summon: Yojimbo to remove some problem from a third party (value for me), and I'm left with the rest of the saga (value for me)

Rule zero: this is a 120-card deck with Yorion, Sky Nomad as companion. Commander decks are exactly 100 cards, so Yorion can never be a legal companion; I ask the table first. Yorion flickers battles (fresh ETB, new protector, full defense), sagas (back to chapter I) and O-Rings (new target).

The house always wins. The deck is very saga-focused, mostly by accident: most permanents with removal on ETB plus ongoing value just happen to be sagas. Fundamentally, though, this deck is about battles and politicking people into hitting them."""

