name = "gogo is an eldrazi"
format = "commander"
description = """
Gogo copies an activated or triggered ability you control X times for {X}{X}. Point it at a land-fetch ability and it's mono-blue ramp. Point it at an Eldrazi cast trigger and it gets silly.

Gameplan:
- play gogo
- play fetchland (or other activated ability ramp like burnished hart)
- hold up interaction
- crack fetchland with gogo for ramp
- if you cant play an eldrazi go to step 2, if you can continue
- play eldrazi, optionally copy cast trigger or annihilator with gogo
- ???
- win

The fetchland's cost is paid once and every copy finds its own land. Burnished Hart, Solemn Simulacrum, Wayfarer's Bauble, Dreamscape Artist and Myriad Landscape work the same way, and Crucible of Worlds replays the cracked fetches.

The cast triggers are the payoff. Copy Ulamog, the Defiler's and an opponent exiles half their library, then half of what's left. Copy Emrakul, the World Anew's and take two players' creatures. Nulldrifter and Kozilek, the Broken Reality draw more per copy. Annihilator copies too, and It That Betrays takes every nontoken permanent they sacrifice."""

