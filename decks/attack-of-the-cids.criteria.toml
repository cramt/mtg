# Curve: does the deck cast what it should, when it should. Mana spent here is gone, so the
# colour questions live in attack-of-the-cids.pips.criteria.toml, which casts nothing.

# Check/fast lands are untapped early; shocks and the pay-3-life MDFCs get paid when a
# turn-2 cycle is on the line; Sea of Clouds and Morphic Pool are untapped in multiplayer.
[assume]
untapped = ['name:"Hallowed Fountain"', 'name:"Watery Grave"', 'name:"Godless Shrine"', 'name:"Glacial Fortress"', 'name:"Seachrome Coast"', 'name:"Darkslick Shores"', 'name:"Concealed Courtyard"', 'name:"Morphic Pool"', 'name:"Sea of Clouds"', 'name:"Sink into Stupor"', 'name:"Witch Enchanter"', 'name:"Sea Gate Restoration"', 'name:"Fell the Profane"', 'name:"Drowned Catacomb"', 'name:"Isolated Chapel"']

[mulligan]
keep = [{ query = "t:land", min = 2, max = 5 }]
down_to = 6
bottom = ['mv>=5', 't:land']

[casting]
prefer = ['cat:"Ramp"', 'name:"Sakashima of a Thousand Faces"', 'name:"Ravos, Soultender"']

[[criterion]]
name = "commander on curve (Sakashima turn 3 or Ravos turn 4, off a 2-mana rock)"
at_least = 0.15
[[criterion.any_of]]
require = [{ turn = 3, cast = 'name:"Sakashima of a Thousand Faces"', min = 1 }]
[[criterion.any_of]]
require = [{ turn = 4, cast = 'name:"Ravos, Soultender"', min = 1 }]

[[criterion]]
name = "a commander down by turn 4"
at_least = 0.55
[[criterion.any_of]]
require = [{ turn = 4, cast = 'name:"Sakashima of a Thousand Faces"', min = 1 }]
[[criterion.any_of]]
require = [{ turn = 4, cast = 'name:"Ravos, Soultender"', min = 1 }]

[[expect]]
name = "Cids seen by turn 6"
turn = 6
query = 'cat:"Cid"'
