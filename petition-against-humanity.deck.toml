name = "Petition Against Humanity"
format = "commander"
description = """
Imported from Moxfield (https://moxfield.com/decks/k3WaVmQSwkmzpdgo6uEFjw, by DeckedOutShow: Good Time Boys Episode 89, VeggieWagon's list, last updated 2025-02-16), recategorized by what each card's oracle text does. The 21-card Moxfield maybeboard is kept as Maybeboard.

Two any-number cards, 21 Persistent Petitioners and 18 Slime Against Humanity, glued together by Katilda and Lier. Every Petitioners is a Human spell, so casting one gives a Slime in the graveyard flashback at its mana cost, and each Slime counts every other Slime in the graveyard and exile. Four Petitioners tapping together mill twelve: aimed at yourself it stocks the graveyard with Slimes, aimed at an opponent it's the alternate win.

Katilda, Dawnhart Prime and Enduring Vitality turn the Petitioners into mana dorks, while Drumbellower and Quest for Renewal untap them on every opponent's turn, so the Advisors mill once per player per round. Same-name payoffs scale with the pile: Nantuko Shrine and Aven Shrine trigger off graveyard copies, Locket of Yesterdays discounts each copy, Thrumming Stone ripples into more copies, Spellweaver Helix with two Slimes imprinted copies the other every time one is cast, and Wood Sage naming Petitioners digs for Advisors and bins everything else. Catalyst Stone cuts Katilda's granted flashback by two, so a graveyard Slime costs {G}.

Watch out: Dusk kills your own Oozes once they're big; Dawn returns every Petitioners (power 1) from the graveyard."""

