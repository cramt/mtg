name = "Petition Against Humanity"
format = "commander"
description = """
Imported from Moxfield (https://moxfield.com/decks/k3WaVmQSwkmzpdgo6uEFjw, by DeckedOutShow: Good Time Boys Episode 89, VeggieWagon's list, last updated 2025-02-16), recategorized by what each card's oracle text does. The 21-card Moxfield maybeboard is kept as Maybeboard.

Two any-number cards, 21 Persistent Petitioners and 18 Slime Against Humanity, glued together by Katilda and Lier. Every Petitioners is a Human spell, so casting one gives a Slime in the graveyard flashback at its mana cost, and each Slime counts every other Slime in the graveyard and exile. Four Petitioners tapping together mill twelve: aimed at yourself it stocks the graveyard with Slimes, aimed at an opponent it's the alternate win.

Katilda, Dawnhart Prime and Enduring Vitality turn the Petitioners into mana dorks, while Drumbellower and Quest for Renewal untap them on every opponent's turn, so the Advisors mill once per player per round. Same-name payoffs scale with the pile: Locket of Yesterdays discounts each copy, Thrumming Stone ripples into more copies, Spellweaver Helix with two Slimes imprinted copies the other every time one is cast, and Wood Sage naming Petitioners digs for Advisors and bins everything else. The Earth Crystal and Locket of Yesterdays make a graveyard Slime cost {G} or less.

2026 update (post-Feb-2025 printings): Petitioners taps any four Advisors, so Human Advisors (Rick Jones, Jennifer Walters) trigger Katilda and count toward the mill-twelve. The Water Crystal turns every one-card Petitioners ping at an opponent into five and makes Petitioners cost {U}. The Earth Crystal doubles the Oozes' counters. Merciful Mandate untaps the whole team for a second round of activations, and Katilda can flash it back. Jennifer Walters stops opponents casting spells on the turn the Slimes go off. Draw is flashback-friendly and graveyard-friendly: Cruel Calculations draws one per card milled this turn (Petitioners on yourself is twelve), and Thirst for Identity and Winternight Stories discard two Slimes as upside; Katilda recasts them from the graveyard.

Recursion: Dusk // Dawn is here for Dawn, not the wipe. Self-mill puts it in the graveyard, where aftermath lets you cast Dawn directly, returning every Petitioners (power 1) and Eternal Witness (power 2) to hand. Eternal Witness is a Human, so it triggers Katilda as well as returning a card. Noxious Revival costs {G/P}, so Katilda's flashback recasts it for 2 life and no mana: put Dawn, a Crystal or a dead engine piece back on top."""

