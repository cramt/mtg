name = "Spoiler Alert"
format = "commander"
description = """
The third Lantern deck. Lantern of Insight and Wizened Snitches make every player play with the top card of their library revealed, so you always know what's coming next. Then you choose it.

Rashmi and Ragavan trigger on your first spell each turn: exile the top card of target opponent's library, make a Treasure, and cast that card for free if its mana value is less than the number of artifacts you control. If it's too big, you can still cast it this turn. With every top card revealed, you pick which opponent to rob, and the mill artifacts clear away anything not worth stealing first.

The sculpting pieces:
- Wand of Denial bins any nonland card on top of a library for 2 life, leaving opponents to draw lands. Codex Shredder mills one player, Ghoulcaller's Bell mills everyone, Pyxis of Pandemonium exiles everyone's top card face down, and Natural Selection stacks the top three of any library at instant speed.
- Unwinding Clock untaps them on everyone else's turn, so if an opponent's next draw is good, it's gone before they draw it.
- The cheap rocks and the Treasures count as artifacts and raise Rashmi's free-cast limit. Academy Manufactor turns each Treasure into three artifacts.

Rashmi's trigger targets the opponent, not the card, so you can mill in response until something worth stealing is on top. Memory Lapse, Hinder, Metamorphose, Expel from Orazca and Noxious Revival go the other way: they put an opponent's spell, permanent or milled card back on top of their library for Rashmi to take next. Cast them at instant speed, in response to the trigger or on an opponent's turn, since the trigger resolves before the spell that caused it. Wizard's Staff makes Rashmi trigger twice. Ornate Kanzashi is a second steal engine: sculpt a top, then take it, and Unwinding Clock untaps it for every opponent's turn.

Closing: Reckless Fireweaver pings every opponent for each artifact that enters (Rashmi's Treasure, three with Academy Manufactor), and Keeper of Secrets hits an opponent for the mana value of every stolen spell. Tezzeret the Seeker's -5 turns the artifact pile into 5/5s.

Counterbalance and Powerbalance use your own revealed top card: counter a spell that matches its mana value, or cast yours for free. Stolen Strategy and Extract Power rob the top of every library at once."""

