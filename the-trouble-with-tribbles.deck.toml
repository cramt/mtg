name = "The Trouble with Tribbles"
format = "commander"
description = """
Rocco tutors Koloth, Tribble Hunter, and is the deck's only creature tutor: he's always in the command zone, so extra creature tutors are dead weight. At each of your end steps, Koloth gives every player two Tribbles. All Tribbles get +1/+0 and are goaded by you, so every opponent's Tribble has to attack someone other than you. Koloth's goad is a static ability, not a one-shot, so it lasts as long as Koloth stays on the battlefield (CR 701.15b).

Give away Maskwood Nexus and \"creatures you control are every creature type\" now applies to the opponent. Their whole board becomes Tribbles: all goaded, all +1/+0, all aimed away from you. Give away Troubling Tribbles and it copies itself every upkeep for whoever controls it, and each copy is goaded too. Iroh, Bazaar Trader and Stiltzkin do the giving, and Rocco finds whichever one you need. Yes Man, Humble Defector, Wedding Ring and Life of the Party give themselves away, and Life of the Party and Wedding Ring hand out copies. Rocco's X fits the cheap donors: Stiltzkin 1, Bazaar Trader 2, Iroh 3, Koloth 4.

Strionic Resonator, Kirol and Roaming Throne (naming Klingon) copy Koloth's end-step trigger. Helm of the Host and Tempestra make nonlegendary Koloth copies, and each copy adds its own trigger and another +1/+0. Death Kiss, Gahiji and Ellie pay off opponents attacking each other, and Bothersome Quasit stops goaded creatures from blocking. Your own Tribbles feed Skullclamp and Tocasia's Welcome.

Ramp is turn-1 one-drops and turn-2 three-drops that net a land plus something else; no two-mana rocks.

Maskwood is the card Rocco can't fetch directly, so the artifact tutors are creatures he can fetch: Curse-Marred Demon (X=4) tutors anything, Goblin Engineer (X=2) bins Maskwood and Sanctum Gargoyle brings it back to hand, which also covers the Demon's random discard hitting it.

Bracket 3: one Game Changer (Enlightened Tutor, for Maskwood or Helm). Koloth, Troubling Tribbles and Tribble Cluster are from Star Trek Commander (release 2026-11-13) and aren't legal before then."""

