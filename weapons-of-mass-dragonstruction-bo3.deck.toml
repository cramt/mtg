name = "Weapons of Mass Dragonstruction (Bo3)"
format = "pioneer"
cover = "eoe/168"
description = """
Pioneer Bo3 Rakdos Weapons Manufacturing: the Bo1 list plus a sideboard. The main deck can differ from the Bo1 list where the Bo3 field calls for it; for now it matches: 1 Thoughtseize main, 3 more in the sideboard. Cheap nontoken artifacts make Munitions, sac outlets cash them in for damage and cards, and Mayhem Devil pings on every sacrifice.

The sideboard leans on artifacts wherever an artifact does the job. Soul-Guide Lantern makes a Munitions, then gets sacrificed for a card or to exile their graveyard, which also turns on revolt for Fatal Push.

Sideboard plan, against the Nov 2026 MTGO field:

- **Golgari Midrange** (Sheoldred, Badgermole Cub, Unholy Annex): +3 Thoughtseize, +2 Heartless Act / -2 Shrapnel Blast, -2 Mishra's Research Desk, -1 Experimental Synthesizer. Keep the Blades: an edict gets Sheoldred when she's alone, which Bauble never does.
- **Izzet Prowess, Mono-Red**: +2 Fire Magic, +2 The Meathook Massacre / -1 Thoughtseize, -2 Mishra's Research Desk, -1 Rottenmouth Viper. Mayhem Devil survives both.
- **Mono-Green Nykthos / Outcaster**: +3 Thoughtseize, +2 Heartless Act, +1 Fire Magic / -2 Mishra's Research Desk, -2 Deadly Dispute, -1 Rottenmouth Viper, -1 Experimental Synthesizer
- **Graveyard decks** (Izzet Cauldron, Spellementals, Golgari Food, Greasefang): +3 Soul-Guide Lantern, +2 Rakdos Charm / -2 Mishra's Research Desk, -1 Rottenmouth Viper, -1 Shrapnel Blast, -1 Deadly Dispute. Lantern does Desk's job here and exiles their yard too; the fourth comes in against Cauldron combo
- **Control, Creativity, Lotus Field**: +3 Thoughtseize / -3 Fatal Push. Thoughtseize is for Temporary Lockdown and Supreme Verdict.
- **Selesnya Company**: +2 The Meathook Massacre, +2 Fire Magic / -1 Thoughtseize, -2 Mishra's Research Desk, -1 Rottenmouth Viper
"""

