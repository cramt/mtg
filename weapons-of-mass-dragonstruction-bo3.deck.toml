name = "Weapons of Mass Dragonstruction (Bo3)"
format = "pioneer"
cover = "eoe/168"
description = """
Pioneer Bo3 Rakdos Weapons Manufacturing: the Bo1 list's main deck plus a sideboard. Cheap nontoken artifacts make Munitions, sac outlets cash them in for damage and cards, and Mayhem Devil pings on every sacrifice.

The sideboard leans on artifacts wherever an artifact does the job. Soul-Guide Lantern and Reckoner Bankbuster each make a Munitions, then get sacrificed for value, which also turns on revolt for Fatal Push.

Sideboard plan, against the Nov 2026 MTGO field:

- **Golgari Midrange** (Sheoldred, Badgermole Cub, Unholy Annex): +3 Thoughtseize, +2 Heartless Act, +2 Reckoner Bankbuster / -3 Shrapnel Blast, -2 Grim Bauble, -2 Mishra's Research Desk
- **Izzet Prowess, Mono-Red**: +2 Fire Magic, +2 The Meathook Massacre / -2 Mishra's Research Desk, -1 Rottenmouth Viper, -1 Deadly Dispute. Mayhem Devil survives both.
- **Mono-Green Nykthos / Outcaster**: +3 Thoughtseize, +2 Heartless Act, +2 Fire Magic / -3 Shrapnel Blast, -2 Mishra's Research Desk, -1 Rottenmouth Viper, -1 Deadly Dispute
- **Graveyard decks** (Izzet Cauldron, Spellementals, Golgari Food, Greasefang): +2 Soul-Guide Lantern, +1 Rakdos Charm, +1 Kolaghan's Command / -2 Mishra's Research Desk, -1 Rottenmouth Viper, -1 Shrapnel Blast
- **Control, Creativity, Lotus Field**: +3 Thoughtseize, +2 Reckoner Bankbuster / -4 Fatal Push, -1 Grim Bauble. Thoughtseize is for Temporary Lockdown and Supreme Verdict.
- **Selesnya Company**: +2 The Meathook Massacre, +2 Fire Magic / -2 Mishra's Research Desk, -1 Rottenmouth Viper, -1 Deadly Dispute
"""

