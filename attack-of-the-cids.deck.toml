name = "Attack of the Cids"
format = "commander"
description = """
Ravos + Sakashima, Esper. Eighteen Cid, Timeless Artificer, all mana value 4 and Human. Mill them (Hedron Crab, Stitcher's Supplier, Stillness in Motion, Doombot Harbinger, Glimpse the Unthinkable, Traumatize for half the library), cycle the ones you draw, then bring the pile back at once: Fix What's Broken at X=4, Immortal Servitude at X=4, Patriarch's Bidding naming Artificer, Storm of Souls, or Angel of Glory's Rise off Entomb + Reanimate / Animate Dead. Diabolic Intent finds whichever is missing. Sakashima, Mirror Box and Council of Reeds keep the legend rule off so the pile stays. Each Cid pumps artifact creatures and Heroes per Artificer on the board and in the yard; Maskwood Nexus, Encroaching Mycosynth and Arcane Adaptation make the Cids pump each other, and Cyberdrive Awakener, Whirler Rogue, Doombot, Dragoon's Lance and Gold-Forged Thopteryx carry it through the air.
"""

