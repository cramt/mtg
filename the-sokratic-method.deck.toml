name = "The Sokratic Method"
format = "commander"
description = """
Group hug that hugs back. Every card you give an opponent is a trigger for you, and one-spell-per-turn stax means they can't use the pile you handed them.

Sokrates is the fog. Tap it on an attacker during their combat: the damage is prevented, and the attacker's controller and the player it hit each draw half its power. That is an ability, not a spell, so Rule of Law, Archon of Emeria, Eidolon of Rhetoric and Arcane Laboratory only bind the opponents. Teferi, Time Raveler keeps them at sorcery speed. Freed from the Real and Pemmin's Aura untap Sokrates for {U} each, so open blue mana is how many attackers you fog, and Thousand-Year Elixir adds one more. Illusionist's Bracers and Rings of Brighthearth copy the activation onto a second attacker. Untapping it also brings its hexproof back.

Making them draw: Howling Mine, Kami of the Crescent Moon and Dictate of Kruphix give every opponent a second card on their own draw step. Vision Skeins, Truce, Temple Bell, Mikokoro, Geier Reach Sanitarium, Lore Broker, Jace's Archivist, Jace Beleren and Gleaming Splendor do it at instant speed or on your turn, which is when Troi pays off. Arcane Denial counters a spell and hands out two cards.

Paid for it: Faerie Mastermind, The Unagi of Kyoshi Island, King T'Challa, Trouble in Pairs and The Council of Four draw off opponents' second cards. Gleaming Splendor, Smothering Tithe and Tataru Taru turn their draws into Treasure, and Treasure pays for untaps. Consecrated Sphinx and Mind's Eye draw off every card they draw. Krang makes each of those triggers fire twice.

Closing: Scrawling Crawler makes every opponent draw cost a life, two with Krang, so Prosperity for X is X (or 2X) to each opponent. Troi turns opponents' draws on your turn into a flying army. Approach of the Second Sun is the backup: this deck digs seven cards deep in a turn."""

