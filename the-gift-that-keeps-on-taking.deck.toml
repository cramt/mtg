name = "The Gift That Keeps On Taking"
format = "standard"
description = """
Boros tempo that gives the opponent permanents that eat their own lands.

The Naked Time ramps a Mountain, then chapter II gives every creature entering that turn a +1/+1 counter and haste. At the start of combat, Iroh, Tea Master hands the Saga to the opponent: the chapter II trigger is yours, so Iroh's Ally still enters with a counter and haste. Next turn the opponent puts the lore counter on, reads chapter III, and sacrifices one of their own lands. Turn 2 Naked Time into turn 3 Iroh is two 3/3 hasty attackers and a Stone Rain.

Molten Man, Inferno Incarnate is the same joke as a creature: a 0/0 that's +1/+1 per Mountain its controller has, with "when this leaves the battlefield, sacrifice a land". Give it to anyone without Mountains and it dies to state-based actions (CR 704.5f), and the leave trigger belongs to whoever controlled it when it left (CR 603.3a, 603.10a): they sacrifice the land. On your side it fetches a Mountain and is a 3/3 or bigger. Against Mountain decks keep it, or donate it and Torch the Tower it (exile is still leaving the battlefield).

Stiltzkin and Harmless Offering are extra ways to give; Zidane makes a Treasure every gift. Voice of Victory and Dalkovan Packbeasts mobilize: their attack tokens enter during chapter II too, so each gets a +1/+1 counter (turn 2 Naked Time, turn 3 Voice is a 2/4 and two 2/2s, all hasty). Dalkovan Encampment does the same from a land slot, and is untapped next to any Mountain. Voice also stops the opponent answering Iroh on your turn. Torch the Tower can bargain away Iroh's Food, or your own Naked Time before chapter III when there's no Iroh.

Iroh's token counts permanents you own that opponents control as it's made, so after a Molten Man gift it counts 0: Molten Man's death trigger goes on the stack above Iroh's reflexive one (APNAP, CR 101.4) and resolves first."""

