name = "Baby Tron Cultivates"
format = "commander"
description = """
The turn-2 half of Maldhound's Baby Tron package (Good Time Boys ep 63 and 65), the 1-3-5 mana ladder: a 1-mana accelerant on turn 1, a 3-mana ramp piece on turn 2 off two lands plus that elf, then 5+ mana on turn 3. The other half is Baby Tron Elves.

Each card costs 3, adds at least one permanent mana by turn 3, and also does something else: a land to hand, a card, a body, removal, haste, a flashback. A 3-drop that taps for two or more counts on its own. The categories say how it ramps.

A card pool, not a deck: green or colourless, no Game Changers, no Sol Ring.
"""

