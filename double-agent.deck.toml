name = "Double Agent"
format = "commander"
description = """
Yes Man, Personal Securitron plants a spy. Tutor up Spy Kit, equip it to Yes Man, then tap Yes Man to hand it to an opponent and draw two. You keep control of the Kit (CR 301.5d), so it stays on Yes Man, and Yes Man now has the name of every nonlegendary creature card. Two objects with one name in common "have the same name" (CR 201.2a), so the opponent's whole nonlegendary board now shares a name with your spy.

That turns the opponent-side "same name" removal into one-sided wipes. Declaration in Stone takes that player's board, Banishment takes every opponent's, and Winnow kills anything for 2 and draws. Yes Man goes with them to the command zone, and paying 2 more for another draw-two-and-wipe is fine. Eye of Singularity destroys every nonlegendary creature on the battlefield while Mithril Coat keeps Yes Man alive, and Cornered Market stops anyone casting nonlegendary creatures while the spy is out. That includes you, so it's a late-game lock.

Assault Suit keeps the donated Yes Man from being sacrificed or attacking you with your own commander damage. Stoneforge, Stonehewer Giant, Taj-Nar, Captain America, Cloud and the rest find Spy Kit, Assault Suit, or Kaldra Compleat and Batterskull to close. The artifact rocks pay for equip costs and commander tax, and Foundry Inspector discounts Yes Man itself. When Yes Man dies instead of being exiled, it stays in the graveyard for Battle of Hoover Dam, Pre-War Formalwear, Sun Titan and Recommission. Wild Card's Soldiers feed Skullclamp and Mentor of the Meek.

Bracket 2: no Game Changers, so no Enlightened Tutor or Smothering Tithe."""

