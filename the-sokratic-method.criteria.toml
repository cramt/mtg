# Sokrates is a utility commander, not the engine: the engine is "opponents draw"
# plus a payoff for it, and those cost 4-6. So the ramp is 2-mana rocks aimed at
# turn 3-4 payoffs, not a 1-drop accelerant for a turn-2 Sokrates.
#
# Gauntlet's mana figures are floors (Exotic Orchard pays no colour, Prairie
# Stream and Mystic Sanctuary read as tapped, no Treasure). The mana thresholds
# below sit just under the 38-land build as measured on 2026-11-17, so they are
# regression guards for list changes, not claims about real games.

[mulligan]
keep = [{ query = "t:land", min = 3, max = 5 }]
down_to = 6
bottom = ['mv>=6', 't:land']

[assume]
# Sea of Clouds is untapped with two or more opponents.
# Checklands and castles with 16 basics plus Fountain, the shock paid early, and
# the fastland in the first three drops: untapped in the games that matter.
untapped = ['o:"two or more opponents"', 'name:"Hallowed Fountain"', 'name:"Glacial Fortress"',
            'name:"Castle Vantress"', 'name:"Castle Ardenvale"', 'name:"Seachrome Coast"']

[casting]
prefer = ['name:"Sokrates, Athenian Teacher"', 'cat:"Ramp"']

[[criterion]]
name = "Sokrates on curve (turn 3)"
at_least = 0.75
require = [{ turn = 3, cast = 'name:"Sokrates, Athenian Teacher"', min = 1 }]

[[criterion]]
name = "an opponent-draw payoff in hand by turn 4"
at_least = 0.65
require = [{ turn = 4, query = 'cat:"Draw Payoff"', min = 1 }]

[[criterion]]
name = "engine online by turn 5: a payoff and a second way to make them draw"
at_least = 0.55
require = [
  { turn = 5, query = 'cat:"Draw Payoff"', min = 1 },
  { turn = 5, query = 'cat:"Opponents Draw" or cat:"Untap Sokrates" or cat:"Copy Sokrates"', min = 1 },
]

[[criterion]]
name = "five mana by turn 5 (Unagi, Krang, Council of Four)"
at_least = 0.50
require = [{ turn = 5, can_cast = "{3}{W}{U}" }]

[[criterion]]
name = "a one-spell-per-turn piece by turn 6"
require = [{ turn = 6, query = 'cat:"Stax"', min = 1 }]

[[criterion]]
name = "UU and WW both available by turn 4"
at_least = 0.33
require = [{ turn = 4, can_cast = "{W}{W}{U}{U}" }]

[[expect]]
name = "lands in opener"
turn = 0
query = "t:land"
