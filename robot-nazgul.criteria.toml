# Bench: `gauntlet test robot-nazgul.deck.toml robot-nazgul.criteria.toml [--draw]`
# Topdeck artifacts first, Nazgûl second. Mishra is a 4-drop, so the 2-mana rocks are the
# ramp that matters: rock on 2, Mishra on 3. The engine is a cast-from-top permanent
# (Forge, Skull, Mm'menon, Reality Chip, Fortune Teller's Talent) fed by topdeck setup
# (Top, Scroll Rack, Brainstorm, the artifact Brainstorms), with the artifact tutors aimed
# at the engine. Nazgûl are the win: Mycosynth or Biotransference, then Mishra doubles them.
#
# Fabricate, Transmute Artifact and Tezzeret can't find Mycosynth or Biotransference: both
# are enchantments in the library, and Mycosynth only makes library cards artifacts once
# it's on the battlefield. Only Ringsight reaches them.
#
# Measured 2026-10-27, topdeck rework (old list → new): engine or a tutor for it by
# turn 5 41% → 59%, topdeck setup by turn 3 24% → 58%, a Nazgûl or Ringsight by turn 5
# 70% → 61% (9 → 7 Nazgûl, Pattern Matcher cut), Mishra by turn 4 77% → 76%.
# Then -Sensei's Divining Top +Perception Bobblehead (Top with a reducer and a cast-from-top
# card draws the library: deterministic, not the play pattern), setup by turn 3 58% → 53%.
# -Trinket Mage (only one-shot targets left): an 8th Nazgûl put setup at 48%, Ponder
# holds it at 53%, so Ponder.
# Earlier, 2026-10-20 at 37 lands with fetches, shocks and Battlebond lands: Mishra on
# turn 3 39%, by turn 4 77%. At 34 lands with checklands it was 32% / 70%, and a bench
# of 34 / 36 / 37 lands put 6 mana by turn 6 at 43% / 48% / 51% for +1.5 points of flood.
# A "{U}{B}{R} by turn 3" bar was dropped: can_cast reads what's left after the
# casting line spends the turn's mana on Mishra, so it only re-measured the cast.

[mulligan]
keep = [{ query = "t:land", min = 2, max = 5 }]
down_to = 6
bottom = ['mv>=5', 't:land']

# Lands gauntlet reads as tapped that are untapped here. Shocks are paid for, the
# Battlebond-style lands have two or more opponents in Commander, and the MDFC lands
# enter untapped for 3 life. Fetches still read as the tapped land they find: a floor.
[assume]
untapped = ['name:"Watery Grave" or name:"Blood Crypt" or name:"Steam Vents" or o:"two or more opponents" or name:"Sink into Stupor" or name:"Fell the Profane"']

[casting]
prefer = ['name:"Mishra, Artificer Prodigy"', 'cat:"Ramp"']

[[criterion]]
name = "Mishra on turn 3"
at_least = 0.35
require = [{ turn = 3, cast = 'name:"Mishra, Artificer Prodigy"', min = 1 }]

[[criterion]]
name = "Mishra by turn 4"
at_least = 0.72
require = [{ turn = 4, cast = 'name:"Mishra, Artificer Prodigy"', min = 1 }]

[[criterion]]
name = "cast-from-top engine or an artifact tutor for one by turn 5"
at_least = 0.55
require = [{ turn = 5, query = 'cat:"Cast From Top" or name:"Fabricate" or name:"Transmute Artifact" or name:"Tezzeret the Seeker" or name:"Tribute Mage"', min = 1 }]

[[criterion]]
name = "topdeck setup by turn 3"
at_least = 0.52
require = [{ turn = 3, query = 'cat:"Topdeck Setup"', min = 1 }]

[[criterion]]
name = "Mycosynth, Biotransference or Ringsight by turn 6"
require = [{ turn = 6, query = 'cat:"Artifact Enabler" or name:"Ringsight"', min = 1 }]

[[criterion]]
name = "a Nazgûl or Ringsight by turn 5"
at_least = 0.58
require = [{ turn = 5, query = 'cat:"Nazgûl" or name:"Ringsight"', min = 1 }]

[[expect]]
name = "lands in opener"
turn = 0
query = "t:land"

# Rocks the standard library skips. A Signet turns {1} into two coloured mana, so it
# nets one. Fellwar Stone's colours depend on opponents' lands; read as one mana.
[[effect]]
match = 'name:"Dimir Signet" or name:"Rakdos Signet" or name:"Izzet Signet" or name:"Fellwar Stone"'
on = "cast"
adds = 1
