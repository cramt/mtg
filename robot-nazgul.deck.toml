name = "Robot Nazgûl"
format = "commander"
description = """
Mishra, Artificer Prodigy fetches a card with the same name every time you cast an artifact spell. Encroaching Mycosynth and Biotransference make your creature spells, and every nonland permanent card in your library, artifacts. Each Nazgûl you cast brings a second one with it, so all nine take about five casts.

Every Nazgûl has its own "whenever the Ring tempts you, put a +1/+1 counter on each Wraith". With k of them out, one temptation is k counters on each, and nine arriving one after another is 285 counters of deathtouch. Token copies are Wraiths with the same trigger: Mirrorworks copies every Nazgûl that enters (with Mycosynth out it's an artifact), Flameshadow Conjuring and both Saheelis make temporary copies that still tempt on the way in, and Brudiclad turns every Necron Warrior and Myr token you have into a Nazgûl at the start of combat.

Mechanized Production is the alternative win. It copies a Nazgûl every upkeep and wins at eight artifacts that share a name. Nine Nazgûl qualify, and so do eight Necron Warriors, because Biotransference makes one for every artifact spell you cast.

Mishra's search may come up empty (CR 701.23b), so with Mycosynth out every permanent you cast is an optional shuffle. That turns Brainstorm, Scroll Rack and Sensei's Divining Top into "keep the best, shuffle the rest away". Mystic Forge, Mm'menon and Crystal Skull cast artifacts from the top of your library, and Mycosynth makes that nearly every card. Top plus Forge is {1}: draw a card, then recast Top from the top of your library, which with Biotransference out also makes a 2/2.

Bracket 3 by feel, 2 by rule: no Game Changers and no two-card infinites. Mechanized Production is a telegraphed upkeep win that takes a few turns of setup."""

