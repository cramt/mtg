name = "Layer Cake"
format = "commander"
description = """
Mimeoplasm, Revered One as a layer-stacking toolbox fed by a self-milling Baby Tron mana base. Copy effects live in layer 1, and an effect that changed Mimeoplasm without a duration stays on it when it switches to copying something else (CR 707.4). So you make one form do something permanent, then turn into a different creature and keep it. Each layer stacks on the last, hence the name.

Mimeoplasm wants a lot of mana: X is both the number of creatures it exiles and three +1/+1 counters each, and every {2} switch and lore reset costs mana on top. The ramp is Maldhound's Baby Tron 1-3-5 ladder: eleven one-drop accelerants for turn 1, a 3-mana ramp piece on turn 2, Mimeoplasm at X=2 on turn 3. Delighted Halfling's mana is any colour for a legendary spell, and Mimeoplasm is one. The late game is lands coming back out of the graveyard: Summon: Titan, World Shaper, Splendid Reclamation, Life from the Loam, Primal Witchstalker and Tato Farmer, plus Nog's "play lands from your graveyard" stuck onto whatever Mimeoplasm turns into.

It also wants a full graveyard, because Mimeoplasm only copies the creatures it exiled as it entered. Satyr Wayfinder, Grisly Salvage, Mulch, Glimpse the Unthinkable, Hedron Crab, Six, Sidisi, Skull Prophet, Aftermath Analyst, Stitcher's Supplier and the dredgers (Golgari Grave-Troll, Stinkweed Imp, Dakmor Salvage, Life from the Loam) fill it, and Buried Alive, Entomb, Unmarked Grave, Lively Dirge and Lotuslight Dancers find the exact pieces. Milled lands feed the land recursion, so the two plans are one plan. Tato Farmer is the glue: every land drop gives you rad counters, rad counters mill you each main phase, and Tato puts a land milled that turn onto the battlefield.

The engine is Summon: Titan as a Mimeoplasm form. Chapter I mills five, chapter II returns every land in your graveyard to the battlefield. Mimeoplasm never entered as a Saga, so it starts at zero lore counters when it becomes one. Lore counters are just counters and carry across switches, so chapters from different Summons mix (CR 715.2b). Soul Diviner, O'aka, Fain, Xavier Sal, Heartless Act and Nesting Grounds take the lore counter back off, and the next main phase fires the same chapter again: mill five and return all lands every turn as Titan, a nonland permanent destroyed every turn as Bahamut. Proliferate pushes it a chapter forward at instant speed. When a final chapter triggers, switch out in response; the trigger still resolves (CR 113.7a) and the sacrifice SBA only hits Sagas (CR 715.4).

The kill: Summon: Primal Odin's chapter II gives Mimeoplasm "whenever this creature deals combat damage to a player, that player loses the game" with no duration (layer 6). Switch into Invisible Stalker and you're a hexproof, unblockable creature with that trigger, and each hit removes a player. Surge Engine does the same through its own steps: {U} loses defender and gains can't be blocked with no duration, so it outlives every later switch.

Nog and Surge Engine are pseudo-levelers whose stages pile up. Do Nog first, because a type change you already made (layer 4) beats the type the new copy gives (layer 1), and Nog's "if Nog is a Rogue" check would fail. Training Grounds and Biomancer's Familiar make each switch cost {1}. If Mimeoplasm dies, its exiled cards are gone for good, which is what Swiftfoot Boots, Heroic Intervention and Ripples of Potential are for.

Bracket 3: no Game Changers, no two-card infinites. Lighthouse Chronologist is out on purpose: on Mimeoplasm it's an extra turn every opponent's turn, which is looped extra turns and bracket 4. Frodo, Sauron's Bane would be the best pseudo-leveler here but it's white. Scavenging Ooze is out because it eats the deck's own graveyard."""

