name = "Layer Cake"
format = "commander"
description = """
Mimeoplasm, Revered One as a layer-stacking toolbox. Copy effects live in layer 1, and an effect that changed Mimeoplasm without a duration stays on it when it switches to copying something else (CR 707.4). So you make one form do something permanent, then turn into a different creature and keep it. Each layer stacks on the last, hence the name.

The kill: Mimeoplasm exiles Summon: Primal Odin and Invisible Stalker or Surge Engine. As Odin, chapter II gives it "whenever this creature deals combat damage to a player, that player loses the game" with no duration (layer 6). Switch into Invisible Stalker and you're a hexproof, unblockable creature with that trigger, and each hit removes a player. Surge Engine does the same through its own steps: {U} loses defender and gains can't be blocked, also with no duration, so it outlives every later switch.

The Sagas are the value. Mimeoplasm never entered as a Saga, so it starts at zero lore counters when it becomes one. Lore counters are just counters and carry across switches, so chapters from different Summons mix (CR 715.2b). Soul Diviner, O'aka, Thrull Parasite, Hex Parasite, Fain, Power Conduit, Xavier Sal, Clash of the Eikons and Nesting Grounds take the lore counter back off. Next main phase the same chapter fires again: Bahamut destroys a nonland permanent every turn, Odin a creature, Valefor bounces. Proliferate pushes it a chapter forward at instant speed. When a final chapter triggers, switch out in response; the trigger still resolves (CR 113.7a) and the sacrifice SBA only hits Sagas (CR 715.4).

Nog, Evolved Sleeper and Surge Engine are pseudo-levelers. Their stages are type, ability and base-P/T effects with no duration, so they pile up: Nog's extra land drop and lands-from-graveyard stay on whatever Mimeoplasm turns into next. Do Nog first, because a type change you already made (layer 4) beats the type the new copy gives (layer 1), and Nog's "if Nog is a Rogue" check would fail. Training Grounds and Biomancer's Familiar make each {2} switch cost {1}.

Mimeoplasm only copies what it exiled as it entered, so Buried Alive, Entomb, Unmarked Grave, Lively Dirge, Vile Entomber and Corpse Connoisseur put the right creatures in the graveyard first. The exiled cards are gone for good if Mimeoplasm dies, which is why Swiftfoot Boots, Heroic Intervention, Ripples of Potential and Mutational Advantage are here.

Bracket 3: no Game Changers, no two-card infinites. Lighthouse Chronologist is out on purpose: on Mimeoplasm it's an extra turn every opponent's turn, which is looped extra turns and bracket 4. Frodo, Sauron's Bane would be the best pseudo-leveler here but it's white."""

